<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Entre Hilos y Colores - Contacto </title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/7bb85336a3.js" crossorigin="anonymous"></script>
</head>
<body>
    
    <header>

        <nav class="navbar">
            <a class="logo" href="./index.html"><img src="./assets/img/logo.png" alt="Logo">Entre Hilos y Colores</a>

            <ul class="nav-links">
                <li> <a href="./index.html">Inicio</a></li>
                <li> <a href="./productos.html">Productos</a></li>
                <li> <a href="./galeria.html">Galería</a></li>
                <li> <a href="./nosotros.html">Nosotros</a></li>
                <li> <a href="./contacto.html">Contacto</a></li>
            </ul>

            <div class="shop">
                <a href="./contacto.html"><i class="fa-regular fa-user"></i></a>
                <a href="./contacto.html"><i class="fa-solid fa-cart-shopping"></i></a>
            </div>
        </nav>
    </header>

    <main>
        <h1 class="pages-tittle">Contacto</h1>
        <section class="form-section">
            <form>
                <div class="form-group">
                    <label for="name">Nombre y Apellido</label>
                    <input type="text" name="name" id="name" required placeholder="Juan Escobar">
                </div>
                
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" name="email" id="email" required placeholder="JuanEscobar@ejemplo.com">
                </div>

                <div class="form-group">
                    <label for="tel">Teléfono</label>
                    <input type="tel" name="tel" id="tel" required placeholder="+54 11 9999-9999">
                </div>

                <div class="form-group">
                    <label for="contact">Motivo de contacto</label>
                    <select name="contact" id="contact">
                        <option value="" disabled selected>Elegi una opción</option>
                        <option value="">Consulta</option>
                        <option value="">Compra de un producto</option>
                        <option value="">Pedido personalizado</option>
                        <option value="">Otros</option>
                    </select>

                </div>

                <fieldset>
                    <legend>¿Qué categoría te interesa??</legend>
                    <div class="radio-group">
                        <input type="radio" id="tejidos" name="categoria" value="tejidos" required>
                        <label for="tejidos">Tejidos / Amigurumis</label>
                    </div>

                    <div class="radio-group">
                        <input type="radio" id="porcelana" name="categoria" value="porcelana" required>
                        <label for="porcelana">Porcelana fría</label>
                    </div>

                    <div class="radio-group">
                        <input type="radio" id="ambos" name="categoria" value="ambos" required>
                        <label for="ambos">Ambos</label>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label for="comment">Mensaje</label>
                    <textarea name="comment" id="comment" placeholder="Escribí tu consulta o contanos qué producto estás buscando..." required cols="40" rows="5"></textarea>
                </div>

                <div class="form-buttons ">
                    <button class="btn btn-primary" type="submit">Enviar mensaje</button>
                    <button class="btn btn btn-secondary" type="reset">Limpiar el formulario</button>
                </div>

            </form>
        </section>
    </main>

    <footer>
        <div class="footer-nav">
            <h3>Categorias</h3>
            <ul>
                <li> <a href="./index.html">Inicio</a></li>
                <li> <a href="./productos.html">Productos</a></li>
                <li> <a href="./galeria.html">Galería</a></li>
                <li> <a href="./nosotros.html">Nosotros</a></li>
                <li> <a href="./contacto.html">Contacto</a></li>
            </ul>
        </div>
        
        <div class="footer-social">
            <h3>Redes</h3>
            <div>
             <a href="https://www.instagram.com/entre.hilos_y_colores/" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
             <a href="https://www.facebook.com/EntreHilosyColores150" target="_blank" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
            </div>
        </div>
    </footer>
</body>
</html>
